name: PdfLens release

# PdfLens is a fork, so it cannot use the shared release workflow (that one needs storytold's
# signing secrets and paid macOS runners). This builds the Windows x64 installer and portable zip
# and the macOS universal DMG and CLI zip, all unsigned (the Mac build is ad-hoc signed), and drafts
# a GitHub Release for the owner to publish. The app's update check reads published releases of
# this repository, so nothing reaches users until the draft is published.
#
# Release: set the version with `cargo xtask version set X.Y.Z`, merge that to main, then push the
# tag `vX.Y.Z` on that commit. Run it by hand (workflow_dispatch) to build without releasing: the
# packages are then only workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdflens-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      date: ${{ steps.read.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: read
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          # A tag must name the version it builds, or the update check would compare the wrong numbers.
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Japanese fonts and translations, at the same pins the official PdfCraft release uses.
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: pdflens-release-windows-x64
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          PDFCRAFT_REQUIRE_WINRES: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdflens-windows-x64
          path: |
            dist/release/pdflens-*.msi
            dist/release/pdflens-*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    # The standard runner, free for public repositories (the official release uses a paid larger one).
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: pdflens-release-macos-universal
      # No MACOS_SIGN_IDENTITY: package.sh signs ad-hoc and skips notarization (no Apple account).
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdflens-macos-universal
          path: |
            dist/release/pdflens-*.dmg
            dist/release/pdflens-cli-*.zip
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: [version, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pdflens-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum pdflens-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "PdfLens $VERSION" --generate-notes \
            dist/pdflens-* dist/SHA256SUMS.txt
